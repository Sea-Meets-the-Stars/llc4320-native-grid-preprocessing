run:
  run_id: "global_test00"
  log_dir: "../test_logs/"

data:
  sampling_step: 168  # hours between snapshots (168 = weekly)
  start_record: 1180
  timestep_hours: 168  # total hours to process; overridden by date_iterations if set

  date_iterations:
    - '2012-11-09 12:00:00'
  # --- specify exact timestamps in YYYY-MM-DD HH:MM:SS (ISO) format ---
  # If set, date_iterations overrides sampling_step / start_record / timestep_hours.

sampling:
  # not used by the global script but config.py still requires the section
  bias_to_high_gradients: 1.0
  sample_points_per_snapshot: 1

output:
  target_km_res: 150    # not used in the global script; kept for config compatibility
  down_sample_res: 64   # not used in the global script; kept for config compatibility
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  folder: "native_grid_dbof_training_data/"
  dataset_name: "global.zarr"  # overridden per-subset (see subsets below)

features:
  # These two fields are required by load_config / FeaturesConfig.
  # They are overwritten at runtime by the selected subset's values below —
  # you do not need to edit them manually.
  model_data_feature_channels: []
  compute_features_channels: []

runtime:
  zarr_async_concurrency: 128

# ---------------------------------------------------------------------------
# Combined-script configuration
# ---------------------------------------------------------------------------
# active_subset : default subset when --subset is not passed on the CLI.
#   One of: native_fields | frontal_structure | kinematic | dynamical | geostrophic
active_subset: kinematic

# subsets : per-subset channel lists and (optional) dataset name.
#   The selected subset's values are injected into features / output at
#   runtime before the pipeline runs — without touching this file.
#
#   gradb2 is ALWAYS appended automatically by the base pipeline regardless
#   of which subset is selected.  Do not add it to any channel list below.
subsets:

  native_fields:
    # Raw model state variables — no derived quantities are computed.
    # Output contains the 6 native model fields plus the automatic gradb2.
    dataset_name: "native_fields.zarr"
    model_data_feature_channels:
      - Theta
      - Salt
      - Eta
      - U
      - V
      - W
    compute_features_channels: []

  frontal_structure:
    # Scalar gradient-magnitude fields characterising front intensity and
    # water-mass structure. Output also includes the automatic gradb2.
    dataset_name: "frontal_structure.zarr"
    model_data_feature_channels: []
    compute_features_channels:
      - gradb2
      - gradsalt2
      - gradtheta2
      - gradeta2
      - gradrho2
      - turner_angle

  kinematic:
    # Velocity-derived scalar fields computed from a single Jacobian pass
    # (relative vorticity, strain components, divergence, Rossby number,
    # Okubo-Weiss parameter, Coriolis parameter).
    # Output also includes the automatic gradb2.
    dataset_name: "kinematic.zarr"
    model_data_feature_channels: []
    compute_features_channels:
      - relative_vorticity
      - strain_n
      - strain_s
      - strain_mag
      - divergence
      - coriolis_f
      - rossby_number
      - okubo_weiss

  frontogenesis:
    # Kinematic frontogenesis tendency only.
    # Deliberately limited to one field to keep the Dask task graph as small
    # as possible.  The geostrophic decomposition fields (which require
    # additional Eta-gradient lineages) are in the 'geostrophic' subset;
    # computing them here alongside frontogenesis_tendency is what triggers
    # the large-graph / run_spec scheduler warnings.
    # Output also includes the automatic gradb2.
    dataset_name: "frontogenesis.zarr"
    model_data_feature_channels: []
    compute_features_channels:
      - frontogenesis_tendency
      - ug
      - vg
      - frontogenesis_geo
      - frontogenesis_ageo

