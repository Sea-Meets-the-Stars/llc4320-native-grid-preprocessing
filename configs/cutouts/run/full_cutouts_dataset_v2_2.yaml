run:
  run_id: "2_02/"
  log_dir: "logs/"

# Source: generate-global output consumed as cutout input.
# Each field in `feature_channels` is mapped to the subset store that contains
# it; that <subset>.zarr must exist under folder/<date_prefix>/ or the run
# fails fast with a message naming the missing subset.
input:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof"
  folder: "globals_for_cutouts/v2_2_01/"
  #date_prefixes:                                # including no dates should process all. 
  grid_access:                                  # rectangular llc4320 grid store
    s3_endpoint: "https://s3-west.nrp-nautilus.io"
    bucket: "dbof"
    folder: "LLC4320_GRID_2D"
    dataset_name: "llc4320_grid.zarr"

sampling: # info on these configs can be found in docs/Sampling_With_GradB2.md
  bias_to_high_gradients: 1.3
  sample_points_per_snapshot: 300

output:
  target_km_res: 150
  down_sample_res: 64
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  folder: "cutouts_dataset_v2/"
  dataset_name: "cutout_dataset.zarr"

feature_channels:
    - Eta
    - Salt
    - Theta
    - U
    - V
    - W
    - gradb2
    - oceTAUX
    - oceTAUY
    - gradrho2
    - turner_angle
    - strain_n
    - strain_s
    - strain_mag
    - divergence
    - relative_vorticity
    - coriolis_f
    - oceQnet
    - ekman_pumping
    - wind_stress_curl
    - SIarea
runtime:
  zarr_async_concurrency: 128
  dask_scheduler: "distributed"
  dask_n_workers: 15
  dask_threads_per_worker: 1