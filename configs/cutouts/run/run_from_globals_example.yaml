run:
  run_id: "cutout_test_data_v1"
  log_dir: "../test_logs/"

# Source: generate-global output consumed as cutout input.
# Each field in `feature_channels` is mapped to the subset store that contains
# it; that <subset>.zarr must exist under folder/<date_prefix>/ or the run
# fails fast with a message naming the missing subset.
input:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof"
  folder: "test_data_for_cutouts/cutout_test_data_v1"   # path to the dir holding the date_prefix snapshots
  date_prefixes:                                # explicit timestamps to process (YYYYMMDD_HHMMSS)
    - "20120209_120000"
    - "20120801_120000"
  grid_access:                                  # rectangular llc4320 grid store
    s3_endpoint: "https://s3-west.nrp-nautilus.io"
    bucket: "dbof"
    folder: "native_grid_dbof_training_data"
    dataset_name: "llc4320_grid.zarr"

sampling: # info on these configs can be found in docs/Sampling_With_GradB2.md
  bias_to_high_gradients: 1.3
  sample_points_per_snapshot: 150

output:
  target_km_res: 150
  down_sample_res: 64
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  folder: "native_grid_dbof_training_data/"
  dataset_name: "cutout_dataset_creation.zarr"

feature_channels:
    - Eta
    - Salt
    - Theta
    - U
    - V
    - W
    - gradb2
    - SIarea
    # - log_gradb is added to the list automatically. This is currently not an optional feature

runtime:
  zarr_async_concurrency: 128
