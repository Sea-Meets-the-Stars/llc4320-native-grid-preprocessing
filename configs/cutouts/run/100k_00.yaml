run:
  run_id: "test00"
  log_dir: "../test_logs/"

data:
  sampling_step: 27
  start_record: 1180
  # 9130 records between start record and end of data
  # 300 samples per snapshot
  # 334 snapshots required - cadence of 27


sampling:
  bias_to_high_gradients: 1.3
  sample_points_per_snapshot: 300

output:
  target_km_res: 150
  down_sample_res: 64
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  folder: "native_grid_dbof_training_data/"
  dataset_name: "dataset_creation.zarr"

features:
  model_data_feature_channels:
    - Eta
    - Salt
    - Theta
    - U
    - V
    - W
  compute_features_channels:
    - relative_vorticity
    # - log_gradb is added to the list automatically. This is currently not an optional feature

runtime:
  zarr_async_concurrency: 128
