  bucket: "dbof/"
  # All raw transfers live under {bucket}/{raw_prefix}/.
  raw_prefix: "LLC4320_RAW"
  # Subset directory read by generate_global.
  folder: "SURFACE"

# ---------------------------------------------------------------------------
# Transfer-specific settings
# ---------------------------------------------------------------------------
transfer:
  mode: "all"

  # Static grid variables — written once to grid.zarr.
  # Geometry, masks, and vertical coordinates.
  # Dimension coordinates (i, j, face, i_g, j_g, k, k_l, k_u, k_p1) are written
  # automatically whenever a data variable that uses them is transferred.
  static_variables:
    - XC
    - YC
    - XG
    - YG
    - Depth
    - CS
    - SN
    - drC
    - drF
    - dxC
    - dxF
    - dxG
    - dxV
    - dyC
    - dyF
    - dyG
    - dyU
    - hFacC
    - hFacS
    - hFacW
    - mask_c
    - mask_s
    - mask_w
    - Z
    - Zl
    - Zu
    - Zp1
    - PHrefC
    - PHrefF
    - rhoRef
    - rA
    - rAz
    - rAw
    - rAs
  static_dataset_name: "grid.zarr"

  # Time-varying fields — SURFACE subset: 2D surface fields + time only.
  variables:
    - Eta
    - oceTAUX
    - oceTAUY
    - SIarea
    - oceQnet
    - time

  # Horizontal tile sizes for zarr chunking (native LLC chunk = 720x720).
  tile_j: 720
  tile_i: 720

runtime:
  zarr_async_concurrency: 128
  # "synchronous" is safest; use "distributed" for parallel chunk writes.
  dask_scheduler: "synchronous"
