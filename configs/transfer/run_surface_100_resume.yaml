# ---------------------------------------------------------------------------
# Config for the LLC4320 transfer CLI — full dataset, SURFACE subset.
#
# Copies the 2D surface fields (+ time) from the MIT LLC4320 zarr store to S3.
# No computation — pure data transfer.
#
# Output (under {bucket}/{raw_prefix}/{folder}):
#   dbof/LLC4320_RAW/SURFACE/grid.zarr          — static grid variables (once)
#   dbof/LLC4320_RAW/SURFACE/{YYYYMMDDTHH}.zarr — time-varying fields (per-date)
#
# RESUME AFTER TIMEOUT: Transfer 100 timesteps from MIT to our S3 bucket. RUN DATE: 30 JUL 2026
#
# Usage:
#   transfer-timestep --config configs/transfer/run_surface_100_resume.yaml --init-store
# ---------------------------------------------------------------------------

run:
  run_id: "transfer_llc4320_surface"
  log_dir: "./logs"

data:
  # Path to the full LLC4320 zarr store on the local / cluster filesystem.
  MIT_data_path: "/orcd/data/abodner/003/LLC4320/LLC4320"

  # Dates for time-varying fields.  Override a single one from CLI with --date.
  date_iterations:
    - '2012-08-30 12:00:00'
    - '2012-09-01 15:00:00'
    - '2012-09-04 13:00:00'
    - '2012-09-09 03:00:00'
    - '2012-09-12 07:00:00'
    - '2012-09-14 16:00:00'
    - '2012-09-18 11:00:00'
    - '2012-09-23 08:00:00'
    - '2012-09-26 09:00:00'
    - '2012-09-29 14:00:00'
    - '2012-10-02 13:00:00'
    - '2012-10-07 12:00:00'
    - '2012-10-09 17:00:00'
    - '2012-10-13 00:00:00'
    - '2012-10-18 12:00:00'
    - '2012-10-19 20:00:00'
    - '2012-10-23 05:00:00'
    - '2012-10-28 09:00:00'
    - '2012-10-31 14:00:00'
    - '2012-11-02 03:00:00'
    - '2012-11-05 18:00:00'
    - '2012-11-10 06:00:00'
    - '2012-11-15 09:00:00'

output:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  # All raw transfers live under {bucket}/{raw_prefix}/.
  raw_prefix: "LLC4320_RAW"
  # Subset directory read by generate_global.
  folder: "SURFACE"

# ---------------------------------------------------------------------------
# Transfer-specific settings
# ---------------------------------------------------------------------------
transfer:
  mode: "all"

  # Static grid variables — written once to grid.zarr.
  # Geometry, masks, and vertical coordinates.
  # Dimension coordinates (i, j, face, i_g, j_g, k, k_l, k_u, k_p1) are written
  # automatically whenever a data variable that uses them is transferred.
  static_variables:
    - XC
    - YC
    - XG
    - YG
    - Depth
    - CS
    - SN
    - drC
    - drF
    - dxC
    - dxF
    - dxG
    - dxV
    - dyC
    - dyF
    - dyG
    - dyU
    - hFacC
    - hFacS
    - hFacW
    - mask_c
    - mask_s
    - mask_w
    - Z
    - Zl
    - Zu
    - Zp1
    - PHrefC
    - PHrefF
    - rhoRef
    - rA
    - rAz
    - rAw
    - rAs
  static_dataset_name: "grid.zarr"

  # Time-varying fields — SURFACE subset: 2D surface fields + time only.
  variables:
    - Eta
    - oceTAUX
    - oceTAUY
    - SIarea
    - oceQnet
    - time

  # Horizontal tile sizes for zarr chunking (native LLC chunk = 720x720).
  tile_j: 720
  tile_i: 720

runtime:
  zarr_async_concurrency: 128
  # "synchronous" is safest; use "distributed" for parallel chunk writes.
  dask_scheduler: "synchronous"
