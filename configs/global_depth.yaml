# ---------------------------------------------------------------------------
# Config for generate_global_depth.py — S3-based pipeline
#
# This pipeline reads from S3 timestep stores created by transfer_llc4320.py
# and supports two modes:
#   1. Surface-only variables (direct output)
#   2. Derived depth diagnostics (depth -> compute -> reduce -> save)
#
# Full global (x, y, z) stacks are never written.
#
# Usage:
#   generate-global-depth --config configs/global_depth.yaml --subset derived_fields
#   generate-global-depth --config configs/global_depth.yaml --subset eta
# ---------------------------------------------------------------------------

run:
  run_id: "global_depth_test00"
  log_dir: "../test_logs/"

data:
  # date_iterations are required for this pipeline.
  # Each entry must match a transferred timestep store in S3
  # (e.g., '2012-11-09 12:00:00' → 20121109T12.zarr).
  date_iterations:
    - '2012-11-09 12:00:00'

  # Required by DataConfig defaults; not used by this pipeline.
  endpoint_url: "https://mghp.osn.xsede.org"
  sampling_step: 168
  start_record: 1180

sampling:
  # Not used by this script; required by DataConfig.
  bias_to_high_gradients: 1.0
  sample_points_per_snapshot: 1

output:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  folder: "properties/"
  dataset_name: "global_depth.zarr"    # overridden per-subset below
  target_km_res: 150
  down_sample_res: 64

features:
  # Overwritten at runtime by the selected subset's values below.
  model_data_feature_channels: []
  compute_features_channels: []

runtime:
  zarr_async_concurrency: 8
  # The Nautilus NRP S3 endpoint intermittently serves corrupt bytes.
  # The distributed scheduler retries failed tasks (retries=10 in
  # calculated_fields_at_depth.py).  Keep n_workers × threads moderate.
  dask_scheduler: "distributed"
  dask_n_workers: 4
  dask_threads_per_worker: 4


# ---------------------------------------------------------------------------
# S3 source: location of the transferred LLC4320 timestep stores
# (written by transfer_llc4320.py).
# ---------------------------------------------------------------------------
s3_source:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  folder: "LLC4320_v1"
  # Grid store lives in the original (non-corrupt) transfer location.
  # If grid_folder is set, grid.zarr is read from here instead of folder.
  grid_folder: "LLC4320"

# ---------------------------------------------------------------------------
# active_subset : default when --subset is not passed on the CLI.
# ---------------------------------------------------------------------------
active_subset: stratification

subsets:

  # ===========================================================================
  # Depth-resolved diagnostic subsets
  # (depth -> compute -> reduce -> save; full water column used lazily)
  #
  # Fields with four depth variants use the suffixes:
  #   _sfc      z = 0 (surface, k=0)
  #   _z25m     z = 25 m (fixed depth, ~k=3)
  #   _mld      interpolated to the mixed-layer depth
  #   _mld_mean thickness-weighted mean over 0 <= z <= MLD
  # ===========================================================================

  stratification:
    dataset_name: "stratification.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - mixed_layer_depth
      - N2_sfc
      - N2_z25m
      - N2_mld
      - N2_mld_mean
      - ml_heat_content

  vertical_shear:
