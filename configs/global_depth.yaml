# ---------------------------------------------------------------------------
# Config for generate_global_depth.py — S3-based pipeline
#
# This pipeline reads from S3 timestep stores created by transfer_llc4320.py
# and supports two modes:
#   1. Surface-only variables (direct output)
#   2. Derived depth diagnostics (depth -> compute -> reduce -> save)
#
# Full global (x, y, z) stacks are never written.
#
# Usage:
#   generate-global-depth --config configs/global_depth.yaml --subset derived_fields
#   generate-global-depth --config configs/global_depth.yaml --subset eta
# ---------------------------------------------------------------------------

run:
  run_id: "global_depth_test00"
  log_dir: "../test_logs/"

data:
  # date_iterations are required for this pipeline.
  # Each entry must match a transferred timestep store in S3
  # (e.g., '2012-11-09 12:00:00' → 20121109T12.zarr).
  date_iterations:
    - '2012-11-09 12:00:00'

output:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  folder: "properties/"
  dataset_name: "global_depth.zarr"    # overridden per-subset below

runtime:
  zarr_async_concurrency: 8
  # The Nautilus NRP S3 endpoint intermittently serves corrupt bytes.
  # The distributed scheduler retries failed tasks (retries=10 in
  # calculated_fields_at_depth.py).  Keep n_workers × threads moderate.
  dask_scheduler: "distributed"
  dask_n_workers: 4
  dask_threads_per_worker: 4


# ---------------------------------------------------------------------------
# S3 source: location of the transferred LLC4320 timestep stores
# (written by transfer_llc4320.py).
# ---------------------------------------------------------------------------
s3_source:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  folder: "LLC4320_v1"
  # Grid store lives in the original (non-corrupt) transfer location.
  # If grid_folder is set, grid.zarr is read from here instead of folder.
  grid_folder: "LLC4320"

# ---------------------------------------------------------------------------
# active_subset : default when --subset is not passed on the CLI.
# ---------------------------------------------------------------------------
active_subset: stratification

subsets:

  # ===========================================================================
  # Depth-resolved diagnostic subsets
  # (depth -> compute -> reduce -> save; full water column used lazily)
  #
  # Each subset lists base channel names in compute_features_channels and
  # the desired depth variants in depth_suffixes.  The pipeline expands
  # every base × suffix combination at load time:
  #
  #   compute_features_channels: [N2]
  #   depth_suffixes: [sfc, mld]
  #   →  N2_sfc, N2_mld
  #
  # Available depth suffixes:
  #   sfc      z = 0 (surface, k=0)
  #   z25m     z = 25 m (fixed depth, ~k=3)
  #   mld      interpolated to the mixed-layer depth
  #   mld_mean thickness-weighted mean over 0 <= z <= MLD
  #
  # Standalone diagnostics that have no depth variants (e.g.
  # mixed_layer_depth, ml_heat_content) go in extra_channels.
  # ===========================================================================

  stratification:
    dataset_name: "stratification.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - N2
    depth_suffixes: [sfc, z25m, mld, mld_mean]
    extra_channels:
      - mixed_layer_depth
      - ml_heat_content

  vertical_shear:
    dataset_name: "vertical_shear.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - vertical_shear
      - Ri
    # Available: sfc, z25m, mld, mld_mean
    depth_suffixes: [mld]

  mixing_parameters:
    dataset_name: "mixing_parameters.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - Fr
      - Ro
      - Bu
    # Available: sfc, z25m, mld, mld_mean
    depth_suffixes: [mld]

  ertel_pv:
    dataset_name: "ertel_pv.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - ertel_pv
      - ertel_pv_vertical
      - ertel_pv_tilt
    # Available: sfc, z25m, mld, mld_mean
    depth_suffixes: [mld]

  buoyancy_fluxes:
    dataset_name: "buoyancy_fluxes.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - uB
      - vB
      - wB
    # Available: sfc, z25m, mld, mld_mean
    depth_suffixes: [mld]

  surface_wind:
    dataset_name: "surface_wind.zarr"
    surface_only: true
    model_data_feature_channels:
      - oceTAUX
      - oceTAUY
      - oceQnet
    compute_features_channels:
      - wind_stress_curl
      - ekman_pumping
      - u_ekman
      - v_ekman

  energetics:
    dataset_name: "energetics.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - KE
    depth_suffixes: [sfc, z25m, mld, mld_mean]

  frontal_structure:
    dataset_name: "frontal_structure.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - gradb2
      - gradtheta2
      - gradsalt2
      - gradrho2
      - gradeta2
      - turner_angle
    # Available: sfc, z25m, mld, mld_mean
    depth_suffixes: [sfc]

  kinematic:
    dataset_name: "kinematic.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - relative_vorticity
      - strain_n
      - strain_s
      - strain_mag
      - divergence
      - okubo_weiss
    # Available: sfc, z25m, mld, mld_mean
    depth_suffixes: [sfc]

  frontogenesis:
    dataset_name: "frontogenesis.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - frontogenesis_tendency
      - frontogenesis_geo
      - frontogenesis_ageo
      - ug
      - vg
    # Available: sfc, z25m, mld, mld_mean
    depth_suffixes: [sfc]

  # ===========================================================================
  # Native model fields at depth
  # (raw tracers/velocities through the depth-strategy machinery)
  # ===========================================================================

  native_fields:
    dataset_name: "native_fields.zarr"
    surface_only: false
    model_data_feature_channels: []
    compute_features_channels:
      - Theta
      - Salt
      - Eta
      - U
      - V
      - W
    # Available: sfc, z25m, mld, mld_mean
    depth_suffixes: [sfc]

  # ===========================================================================
  # Surface-only subsets
  # (read from the same S3 timestep stores but only use surface data)
  # ===========================================================================

  icearea:
    dataset_name: "icearea.zarr"
    surface_only: true
    model_data_feature_channels:
      - SIarea
    compute_features_channels: []

