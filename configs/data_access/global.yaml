data_access:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof"
  folder: "native_grid_dbof_training_data"

# NOTE:
# - This is NOT a user-selectable value.
# - It MUST exactly match the run_id used when generate-global-combined-dataset
#   was run.  All subsets from a single session share this run_id and are stored
#   in the same S3 directory:
#     s3://{bucket}/{folder}/{run_id}/{subset}.zarr
  run_id: "global_20260318_052958"

# Per-subset zarr names and their channel lists.
#
# NOTE for feature_channels:
# - This is NOT a user-selectable list.
# - It MUST exactly match the channels stored during generation.
# - Ordering matters: channels are stored and read in this order.
# - gradb2 is always the last channel in every subset (appended automatically
#   by the pipeline).
# - Raw model fields (Theta, Salt, Eta, U, V, W) are ONLY present in the
#   native_fields subset.  All other subsets store only computed channels.
#
# Uncomment the run_id line (and update its value) in data_access above once
# a real run has been completed.
  subsets:

    native_fields:
      dataset_name: "native_fields.zarr"
      feature_channels:
        - "Theta"
        - "Salt"
        - "Eta"
        - "U"
        - "V"
        - "W"


    frontal_structure:
      dataset_name: "frontal_structure.zarr"
      feature_channels:
        - "gradsalt2"
        - "gradtheta2"
        - "gradeta2"
        - "gradb2"
        - "gradrho2"
        - "turner_angle"

    kinematic:
      dataset_name: "kinematic.zarr"
      feature_channels:
        - "relative_vorticity"
        - "strain_n"
        - "strain_s"
        - "strain_mag"
        - "divergence"
        - "coriolis_f"
        - "rossby_number"
        - "okubo_weiss"


    frontogenesis:
      dataset_name: "frontogenesis.zarr"
      # frontogenesis_geo  = geostrophic frontogenesis tendency
      # frontogenesis_ageo = ageostrophic frontogenesis tendency (residual)
      feature_channels:
        - "frontogenesis_tendency"
        - "ug"
        - "vg"
        - "frontogenesis_geo"
        - "frontogenesis_ageo"



# Grid Zarr store written by generate_grid_global.py.
# NOTE: The grid is stored WITHOUT a run_id prefix (it is shared across all runs):
#   s3://{bucket}/{folder}/{dataset_name}
# This differs from the snapshot store path, which includes run_id.
grid_access:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof"
  folder: "native_grid_dbof_training_data"
  dataset_name: "llc4320_grid.zarr"
