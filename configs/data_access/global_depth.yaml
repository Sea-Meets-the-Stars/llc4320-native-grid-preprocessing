data_access:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof"
  folder: "properties"

# NOTE:
# - run_id MUST exactly match the run_id used when generate-global-depth was run.
# - date_prefix MUST match the date subdirectory (YYYYMMDD_HHMMSS) produced by
#   the pipeline for the snapshot you want to read.
# - Full path: s3://{bucket}/{folder}/{run_id}/{date_prefix}/{subset}.zarr
  run_id: "testing_019"
  date_prefix: "20121109_120000"

# Per-subset zarr names and their channel lists.
#
# NOTE for feature_channels + depth_suffixes:
# - The downstream reader must expand feature_channels × depth_suffixes
#   to get the full channel list (same logic as the generation pipeline).
#   e.g. feature_channels: [N2] + depth_suffixes: [sfc, mld]
#        → N2_sfc, N2_mld
# - extra_channels are appended without expansion.
# - If depth_suffixes is absent, feature_channels is used as-is (backward
#   compatible with flat channel lists).
# - Ordering matters: channels are stored and read in this order.
#
# All outputs are surface-level (T, C, H, W).  Derived diagnostics that
# depend on depth are computed lazily and reduced to surface fields before
# writing.
  subsets:

    # ---- depth-resolved diagnostics (computed from depth, output as surface) ----

    stratification:
      dataset_name: "stratification.zarr"
      feature_channels:
        - N2
      depth_suffixes: [sfc, z25m, mld, mld_mean]
      extra_channels:
        - mixed_layer_depth
        - ml_heat_content

    vertical_shear:
      dataset_name: "vertical_shear.zarr"
      feature_channels:
        - vertical_shear
        - Ri
      depth_suffixes: [sfc, z25m, mld, mld_mean]

    mixing_parameters:
      dataset_name: "mixing_parameters.zarr"
      feature_channels:
        - Fr
        - Ro
      depth_suffixes: [sfc, z25m, mld, mld_mean]
      extra_channels:
        - Bu_mld

    ertel_pv:
      dataset_name: "ertel_pv.zarr"
      feature_channels:
        - ertel_pv
        - ertel_pv_vertical
        - ertel_pv_tilt
      depth_suffixes: [sfc, z25m, mld, mld_mean]

    buoyancy_fluxes:
      dataset_name: "buoyancy_fluxes.zarr"
      feature_channels:
        - uB
        - vB
        - wB
      depth_suffixes: [sfc, z25m, mld, mld_mean]

    surface_wind:
      dataset_name: "surface_wind.zarr"
      feature_channels:
        - oceTAUX
        - oceTAUY
        - oceQnet
        - wind_stress_curl
        - ekman_pumping
        - u_ekman
        - v_ekman

    energetics:
      dataset_name: "energetics.zarr"
      feature_channels:
        - KE
      depth_suffixes: [sfc, z25m, mld, mld_mean]

    # ---- surface-only model variables ----

    native_fields:
      dataset_name: "native_fields.zarr"
      feature_channels:
        - Theta
        - Salt
        - Eta
        - U
        - V
        - W
      depth_suffixes: [sfc]

    icearea:
      dataset_name: "icearea.zarr"
      feature_channels:
        - SIarea

    frontal_structure:
      dataset_name: "frontal_structure.zarr"
      feature_channels:
        - gradb2
        - gradtheta2
        - gradsalt2
        - gradrho2
        - gradeta2
        - turner_angle
      depth_suffixes: [sfc, z25m, mld, mld_mean]

    kinematic:
      dataset_name: "kinematic.zarr"
      feature_channels:
        - relative_vorticity
        - strain_n
        - strain_s
        - strain_mag
        - divergence
        - okubo_weiss
      depth_suffixes: [sfc, z25m, mld, mld_mean]

    frontogenesis:
      dataset_name: "frontogenesis.zarr"
      feature_channels:
        - frontogenesis_tendency
        - frontogenesis_geo
        - frontogenesis_ageo
        - ug
        - vg
      depth_suffixes: [sfc, z25m, mld, mld_mean]

# Grid Zarr store written by generate_grid_global.py.
# NOTE: The grid is stored WITHOUT a run_id prefix (shared across all runs):
#   s3://{bucket}/{folder}/{dataset_name}
grid_access:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof"
  folder: "native_grid_dbof_training_data"
  dataset_name: "llc4320_grid.zarr"
