data_access:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof"
  folder: "native_grid_dbof_training_data"
# NOTE:
# - This is NOT a user-selectable value.
# - It MUST exactly match the run_id used when the dataset was generated.
  #run_id: "global_properties_20260306_224131" # testing
  #run_id: "global_properties_20260306_174221" 
  run_id: "global_properties_20260307_003609"

# NOTE:
# - This is NOT a user-selectable list.
# - It MUST exactly match the feature channel list used when the dataset was generated.
# - Ordering matters: channels are stored and read in this order.
# - Computed features appear after raw data channels; gradb2 is always last.
#
# If unsure, refer to the run configuration used to generate this dataset.
  feature_channels:
    #- "Eta"
    #- "Salt"
    #- "Theta"
    #- "U"
    #- "V"
    #- "W"
    - "relative_vorticity"
    - "strain_n"
    - "strain_s"
    - "strain_mag"
    - "divergence"
    - "coriolis_f"
    - "rossby_number"
    - "okubo_weiss"
    - "gradb2"

# Grid Zarr store written by generate_grid_global.py.
# NOTE: The grid is stored WITHOUT a run_id prefix (it is shared across runs):
#   s3://{bucket}/{folder}/{dataset_name}
# This is different from the snapshot store path which includes run_id.
grid_access:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof"
  folder: "native_grid_dbof_training_data"
  dataset_name: "llc4320_grid.zarr"
